name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    # aarch64: scripts/build.sh uses the native toolchain there, so there is no
    # cross toolchain to keep in step with the host one.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # CM5-IO is the board most of the current work happens on and it had no
      # CI at all before the restructure -- only ROCK 4D and a NanoPi target
      # that is no longer in this tree.
      matrix:
        board: [cm5io, rock4d, tspi3m]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential uuid-dev nasm acpica-tools device-tree-compiler \
            python3 python3-pyelftools python3-dev swig \
            libssl-dev libgnutls28-dev u-boot-tools \
            gdisk bison flex bc python3-setuptools

      - name: Fetch the device-tree include mirror
        # Compiling the board DTS needs the upstream kernel dt-bindings
        # headers; RockchipPkg.dec puts them on the include path.
        #
        # This used to try github.com/rockchip-linux/rockchip-devicetree first
        # and fall back to a sparse checkout of torvalds/linux.  That repo does
        # not exist (404), and the attempt was silenced with 2>/dev/null, so the
        # "fallback" was always the only path -- and it looked like a safety net
        # that had never once run.  Only the sparse checkout is left.
        run: |
          set -eux
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/torvalds/linux /tmp/linux
          git -C /tmp/linux sparse-checkout set \
            include/dt-bindings arch/arm64/boot/dts/rockchip \
            include/uapi/linux
          # dt-bindings/input/input.h includes linux-event-codes.h, a symlink
          # into include/uapi/linux.  The TaishanPi 3M DTS is the first one
          # here to use it (adc-keys).
          test -f /tmp/linux/include/uapi/linux/input-event-codes.h
          mkdir -p devicetree/mainline/upstream/src/arm64
          ln -sfn /tmp/linux/include devicetree/mainline/upstream/include
          ln -sfn /tmp/linux/arch/arm64/boot/dts/rockchip \
                  devicetree/mainline/upstream/src/arm64/rockchip
          test -d devicetree/mainline/upstream/include/dt-bindings

      - name: Set up host (EDK2, BaseTools, core patches)
        run: yes | scripts/setup-host.sh

      - name: Check zh-Hans strings and glyphs
        # A zh-Hans string whose glyph is missing from ZhHansFontDxe, or
        # whose CJK text is not inside \wide ... \narrow, still builds; it
        # only shows up on screen.  Runs after setup-host so the patched
        # TianoCore .uni files are checked too.
        run: python3 scripts/gen-zh-hans-font.py check

      - name: Build ${{ matrix.board }}
        run: scripts/build.sh ${{ matrix.board }}

      - name: Build the SPL for ${{ matrix.board }}
        # Only boards with SPL_DEFCONFIG in boards/<board>.conf; the others
        # keep the prebuilt SPL in binaries/.
        # package.sh prefers out/<PLATFORM>/idbloader.img when it exists.
        run: scripts/build-spl.sh ${{ matrix.board }}

      - name: Package ${{ matrix.board }}
        run: scripts/package.sh ${{ matrix.board }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-firmware
          # <Board>-<medium>.img only.  out/<PLATFORM>/idbloader.img, the SPL
          # build-spl.sh leaves for package.sh, is inside those images; as
          # an artifact of its own it reached the ci release as one
          # idbloader-edk2-ci-*.img for whichever board was copied last.
          path: |
            out/*/*-*.img
            out/*/*.sfdisk
            out/*/spl.config
          if-no-files-found: error

  # A rolling release tagged "ci" with the images of the latest successful
  # build of main, for Maskrom Studio's CI tier (and anyone who wants the
  # newest build without logging in to download Actions artifacts). It is a
  # pre-release, never "latest", replaced by every successful build, and its
  # notes say it is untested. Asset names follow the releases'
  # (<Board>-emmc-edk2-<tag>.img) with "ci-<sha>" as the tag part, so the
  # same prefixes find them.
  ci-release:
    name: Rolling "ci" release
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Files and checksums
        run: |
          set -eu
          sha=${GITHUB_SHA::7}
          mkdir rel
          find artifacts -name '*.img' | while read -r f; do
            b=$(basename "$f" .img)
            cp "$f" "rel/${b}-edk2-ci-${sha}.img"
          done
          find artifacts -name '*.sfdisk' -exec cp {} rel/ \;
          (cd rel && sha256sum -- * > SHA256SUMS.txt)
          cat rel/SHA256SUMS.txt
      - name: Replace the ci release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=${GITHUB_SHA::7}
          date=$(date -u +%Y-%m-%d)
          printf '%s\n' "Built from ${GITHUB_SHA} on ${date} by the build workflow on main." "" \
            "Untested: these images have not been run on a board. Every successful build of main replaces this release." > notes.md
          gh release delete ci --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ci rel/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "CI build ${sha} ${date}" --notes-file notes.md
