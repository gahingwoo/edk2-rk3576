name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    # aarch64: scripts/build.sh uses the native toolchain there, and the rescue
    # UKI is built by running Alpine's own apk, which needs the target arch.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # CM5-IO is the board most of the current work happens on and it had no
      # CI at all before the restructure -- only ROCK 4D and a NanoPi target
      # that is no longer in this tree.
      matrix:
        board: [cm5io, rock4d]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential uuid-dev nasm acpica-tools device-tree-compiler \
            python3 python3-pyelftools python3-dev swig \
            libssl-dev libgnutls28-dev u-boot-tools \
            mtools gdisk zstd cpio kmod \
            systemd-boot-efi systemd-ukify

      - name: Fetch the device-tree include mirror
        # Compiling the board DTS needs the upstream kernel dt-bindings
        # headers; RockchipPkg.dec puts them on the include path.
        #
        # This used to try github.com/rockchip-linux/rockchip-devicetree first
        # and fall back to a sparse checkout of torvalds/linux.  That repo does
        # not exist (404), and the attempt was silenced with 2>/dev/null, so the
        # "fallback" was always the only path -- and it looked like a safety net
        # that had never once run.  Only the sparse checkout is left.
        run: |
          set -eux
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/torvalds/linux /tmp/linux
          git -C /tmp/linux sparse-checkout set \
            include/dt-bindings arch/arm64/boot/dts/rockchip
          mkdir -p devicetree/mainline/upstream/src/arm64
          ln -sfn /tmp/linux/include devicetree/mainline/upstream/include
          ln -sfn /tmp/linux/arch/arm64/boot/dts/rockchip \
                  devicetree/mainline/upstream/src/arm64/rockchip
          test -d devicetree/mainline/upstream/include/dt-bindings

      - name: Set up host (EDK2, BaseTools, core patches)
        run: yes | scripts/setup-host.sh

      - name: Build ${{ matrix.board }}
        run: scripts/build.sh ${{ matrix.board }}

      - name: Rescue system for ${{ matrix.board }}
        # Only CM5-IO pins a kernel release; the script says so and exits.
        run: |
          if grep -q '^RESCUE_KERNEL_RELEASE=' boards/${{ matrix.board }}.conf; then
            scripts/mkrescue.sh ${{ matrix.board }}
          else
            echo "no rescue system configured for ${{ matrix.board }}"
          fi

      - name: Package ${{ matrix.board }}
        run: scripts/package.sh ${{ matrix.board }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-firmware
          path: |
            out/*/*.img
            out/*/*.sfdisk
          if-no-files-found: error
