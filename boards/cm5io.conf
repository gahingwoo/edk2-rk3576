# ArmSoM CM5-IO (CM5 module on the CM5-IO carrier)
PLATFORM_NAME=CM5IO
DSC_FILE=Platform/ArmSoM/CM5IO/CM5IO.dsc
DEVICE_TREE_NAME=rk3576-armsom-cm5-io
# The carrier's SPI NOR is 64 KB and not reliably detected, so this board
# boots from SD/eMMC and keeps its NV variable store there.
BOOT_MEDIUM=sdcard

# The CM5-IO carrier needs the SPL built with its own U-Boot overlay
# (commit 08ad3cd5).  binaries/idblock_mainline.bin is 2026.04 and predates it.
# This matters for display: the SPL is what leaves DCLK_VOP0 set up, and every
# pre-restructure test image on this board used the 2026.07-rc3 one.
IDBLOCK_OVERRIDE=binaries/idblock_cm5io.bin

# The module's eMMC, for sizing the partition table.  31272730624 bytes is what
# a QK11X reports; a different module would need this changed.
EMMC_BYTES=31272730624

# scripts/build-spl.sh builds the SPL from these, into out/CM5IO/
# idbloader.img, which package.sh then prefers over IDBLOCK_OVERRIDE: mainline
# U-Boot v2026.10 with Armbian's CM5-IO board files (uboot/v2026.10/cm5io,
# the ones Armbian's edge images boot with), DDR init blob v1.08 as Armbian
# uses, the SD card tried first, and uboot/v2026.10/*.patch for "Armbian
# (U-Boot)" (docs/ARMBIAN-CHAINLOAD.md).  NOT RUN ON THE BOARD with this
# firmware: if the picture or the boot breaks, delete SPL_DEFCONFIG below to
# go back to binaries/idblock_cm5io.bin.
SPL_UBOOT_TAG=v2026.10
SPL_UBOOT_COMMIT=5508406582f6f7120dce0c4b3059819a41788db2
SPL_PATCH_DIR=uboot/v2026.10
SPL_BOARD_DIR=uboot/v2026.10/cm5io
SPL_DEFCONFIG=armsom-cm5-io-rk3576_defconfig
SPL_DTS=rk3576-armsom-cm5-io.dts
SPL_DDR_BLOB=rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.08.bin
SPL_DDR_SHA256=7403cf1663d4b0c9d7c692014e0852e60f0d3977209ec75fa755c293f54e2d50
# What this board's image must support (scripts/features.py, docs/dev/features-json.md).
# CI fails when the build lacks one of these.
FEATURES_EXPECTED="windows armbianOnce hdmi usbcDp cpuIdle fanControl networkBoot httpBoot secureBoot"
