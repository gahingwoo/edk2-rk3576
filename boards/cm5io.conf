# ArmSoM CM5-IO (CM5 module on the CM5-IO carrier)
PLATFORM_NAME=CM5IO
DSC_FILE=Platform/ArmSoM/CM5IO/CM5IO.dsc
DEVICE_TREE_NAME=rk3576-armsom-cm5-io
# The carrier's SPI NOR is 64 KB and not reliably detected, so this board
# boots from SD/eMMC and keeps its NV variable store there.
BOOT_MEDIUM=sdcard

# The CM5-IO carrier needs the SPL built with its own U-Boot overlay
# (commit 08ad3cd5).  binaries/idblock_mainline.bin is 2026.04 and predates it.
# This matters for display: the SPL is what leaves DCLK_VOP0 set up, and every
# pre-restructure test image on this board used the 2026.07-rc3 one.
IDBLOCK_OVERRIDE=binaries/idblock_cm5io.bin

# The rescue system is a UKI built by scripts/mkrescue.sh from a release of the
# kernel repo.  Pinned, so an image built today and one built next month differ
# only where this file says they do.
RESCUE_KERNEL_REPO=gahingwoo/linux-rk3576-npu
RESCUE_KERNEL_RELEASE=kernel-7.3.0-rc3-next-20260914-00015-g5b273d685f96-20260917

# The module's eMMC, for sizing the partition table.  31272730624 bytes is what
# a QK11X reports; a different module would need this changed.
EMMC_BYTES=31272730624
