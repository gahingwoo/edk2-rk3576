# Radxa ROCK 4D
PLATFORM_NAME=ROCK4D
DSC_FILE=Platform/Radxa/ROCK4D/ROCK4D.dsc
DEVICE_TREE_NAME=rk3576-rock-4d
BOOT_MEDIUM=spi

# scripts/build-spl.sh builds the SPL from these, into out/ROCK4D/
# idbloader.img, which package.sh then prefers over
# binaries/idblock_mainline.bin.  It is U-Boot v2026.10's own
# rock-4d-rk3576_defconfig and device tree plus uboot/v2026.10/*.patch and
# the spl.config fragment (the XMC flash of v1.12 boards, and the request on
# the SD card that "Armbian (U-Boot)" leaves, docs/ARMBIAN-CHAINLOAD.md).
# The DDR blob is v1.09, the one binaries/rk3576_ddr.bin and
# idblock_mainline.bin carry.
SPL_UBOOT_TAG=v2026.10
SPL_UBOOT_COMMIT=5508406582f6f7120dce0c4b3059819a41788db2
SPL_PATCH_DIR=uboot/v2026.10
SPL_BOARD_DIR=uboot/v2026.10/rock4d
SPL_DEFCONFIG=rock-4d-rk3576_defconfig
SPL_DTS=rk3576-rock-4d.dts
SPL_DDR_BLOB=rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.09.bin
SPL_DDR_SHA256=79bdf7eb259274eec83ea2f6330214b0c0035255bc5563746871f6f8ce7cf089

# What this board's image must support (scripts/features.py, docs/dev/features-json.md).
# CI fails when the build lacks one of these.
FEATURES_EXPECTED="windows armbianOnce hdmi cpuIdle fanControl networkBoot httpBoot secureBoot"
