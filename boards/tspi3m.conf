# LCKFB TaishanPi 3M
#
# Boots to the UEFI front page (2026-11-12).  See docs/HARDWARE.md for what has
# and has not been tried.
PLATFORM_NAME=TaishanPi3M
DSC_FILE=Platform/LCKFB/TaishanPi3M/TaishanPi3M.dsc
DEVICE_TREE_NAME=rk3576-lckfb-tspi-3m
# No SPI NOR.  The NV variable store is on the boot medium, like the CM5-IO.
BOOT_MEDIUM=sdcard

# The BootROM on this board only tries the eMMC, never the SD card, so the SPL
# has to be on the eMMC whatever else is.  This SPL then looks on the SD card
# first for its FIT and falls back to the eMMC.  binaries/README.md has how it
# was built; docs/FLASHING.md has how to install it.
IDBLOCK_OVERRIDE=binaries/idblock_tspi3m.bin

# The board's eMMC (Kioxia "CBHACG"): 121110528 sectors, read from the board.
# With this set package.sh also builds TaishanPi3M-emmc.img, which puts the
# SPL, the firmware and a partition table on the eMMC so no SD card is needed.
# The SPL still looks on the SD card first.
EMMC_BYTES=62008590336
