# LCKFB TaishanPi 3M
#
# Skeleton: builds and packages, not yet booted on the board.
PLATFORM_NAME=TaishanPi3M
DSC_FILE=Platform/LCKFB/TaishanPi3M/TaishanPi3M.dsc
DEVICE_TREE_NAME=rk3576-lckfb-tspi-3m
# No SPI NOR on this board.  It boots from eMMC or SD and keeps its NV
# variable store on the boot medium, like the CM5-IO.
BOOT_MEDIUM=sdcard

# U-Boot SPL 2026.10 built from lckfb-tspi-3m-rk3576_defconfig, the same
# source as the U-Boot in the Armbian images that boot this board.
IDBLOCK_OVERRIDE=binaries/idblock_tspi3m.bin

# EMMC_BYTES is not set, so package.sh builds the SD image only.  Read the
# size off the board (/sys/block/mmcblk0/size * 512) before adding it.
